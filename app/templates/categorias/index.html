{% extends "base.html" %}

{% block title %}Gestión de Categorías{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <div>
        <h1 style="margin: 0;">Lista de Categorías</h1>
    </div>
    
    <a href="{{ url_for('categorias.create') }}" style="background: #3b82f6; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-plus"></i> Nueva Categoría
    </a>
</div>

<div style="margin-bottom: 20px;">
    <input type="text" id="buscador" placeholder="Buscar categoría..." style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box;">
</div>

<div class="table-responsive">
    <table class="custom-table" style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="border-bottom: 2px solid #f1f5f9;">
                <th style="text-align: left; padding: 12px; color: #64748b;">ID</th>
                <th style="text-align: left; padding: 12px; color: #64748b;">Nombre</th>
                <th style="text-align: left; padding: 12px; color: #64748b;">Descripción</th>
                <th style="text-align: center; padding: 12px; color: #64748b;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-categorias">
            {% for categoria in categorias %}
            <tr style="border-bottom: 1px solid #f1f5f9;" class="fila-categoria">
                <td style="padding: 12px;">{{ categoria.id }}</td>
                <td style="padding: 12px;"><strong>{{ categoria.nombre }}</strong></td>
                <td style="padding: 12px;">{{ categoria.descripcion }}</td>
                <td style="padding: 12px; text-align: center;">
                    <div style="display: flex; justify-content: center; gap: 20px;">
                        <a href="{{ url_for('categorias.edit', id=categoria.id) }}" style="text-decoration: none;">
                            <i class="fas fa-pen" style="color: #3b82f6;"></i>
                        </a>
                        
                        <a href="{{ url_for('categorias.destroy', id=categoria.id) }}" 
                           style="text-decoration: none;"
                           onclick="return confirm('¿Eliminar la categoría {{ categoria.nombre }}?')">
                            <i class="fas fa-trash" style="color: #ef4444;"></i>
                        </a>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    document.getElementById("buscador").addEventListener("keyup", function() {
        let filtro = this.value.toLowerCase();
        let filas = document.querySelectorAll(".fila-categoria");

        filas.forEach(function(fila) {
            let texto = fila.innerText.toLowerCase();
            if (texto.includes(filtro)) {
                fila.style.display = "";
            } else {
                fila.style.display = "none";
            }
        });
    });
</script>
{% endblock %}
