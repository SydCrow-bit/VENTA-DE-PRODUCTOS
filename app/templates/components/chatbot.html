<div id="chatbot-container" class="fixed bottom-6 right-8 z-50 flex flex-col items-end gap-3">

    <div id="chat-window"
        class="hidden w-80 sm:w-96 h-[32rem] bg-white dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl flex-col overflow-hidden transition-all origin-bottom-right mb-4">

        <div
            class="flex items-center justify-between px-4 py-3 border-b border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/50">
            <div class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='img/pet-pos.png') }}" alt="Asistente"
                    class="w-8 h-8 rounded-full bg-zinc-200 dark:bg-zinc-800 object-cover border border-zinc-200 dark:border-zinc-700">
                <div>
                    <h4 class="text-sm font-semibold">Asistente Virtual</h4>
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span
                            class="text-[10px] text-zinc-500 dark:text-zinc-400 font-medium uppercase tracking-wider">En
                            línea</span>
                    </div>
                </div>
            </div>
            <button id="close-chat"
                class="text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-zinc-50/50 dark:bg-zinc-950/50">
            <div class="flex gap-3 max-w-[85%]">
                <img src="{{ url_for('static', filename='img/pet-pos.png') }}"
                    class="w-8 h-8 rounded-full bg-zinc-200 dark:bg-zinc-800 flex-shrink-0 object-cover border border-zinc-200 dark:border-zinc-700">
                <div
                    class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl rounded-tl-none px-4 py-2.5 text-sm shadow-sm text-zinc-800 dark:text-zinc-200">
                    ¡Hola, {{ current_user.username }}! Soy tu asistente. ¿En qué puedo ayudarte hoy?
                </div>
            </div>
        </div>

        <div class="p-3 border-t border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="chat-input" autocomplete="off" placeholder="Escribe un mensaje..."
                    class="flex-1 h-10 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-zinc-100 transition-all placeholder:text-zinc-500">
                <button type="submit"
                    class="h-10 w-10 rounded-xl bg-zinc-900 dark:bg-zinc-50 text-zinc-50 dark:text-zinc-900 flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-sm">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="relative flex flex-col items-center group cursor-pointer animate-gentle-float" id="chatbot-toggle">

        <div id="chat-tooltip"
            class="relative bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-50 border border-zinc-200 dark:border-zinc-800 text-sm font-semibold px-5 py-2.5 rounded-2xl shadow-lg mb-3 transition-transform duration-300 group-hover:scale-105 origin-bottom">
            ¿Necesitas ayuda?
            <div
                class="absolute -bottom-1.5 right-10 w-3 h-3 bg-white dark:bg-zinc-900 border-b border-r border-zinc-200 dark:border-zinc-800 transform rotate-45 rounded-sm z-10">
            </div>
        </div>

        <img src="{{ url_for('static', filename='img/pet-pos.png') }}" alt="Mascota"
            class="w-28 h-28 object-contain drop-shadow-[0_15px_15px_rgba(0,0,0,0.25)] transition-transform duration-300 group-hover:scale-110 group-hover:-translate-y-2 active:scale-95">
    </div>
</div>

<script>
    const chatbotToggle = document.getElementById('chatbot-toggle');
    const chatWindow = document.getElementById('chat-window');
    const closeChat = document.getElementById('close-chat');
    const chatTooltip = document.getElementById('chat-tooltip');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');

    chatbotToggle.addEventListener('click', () => {
        chatWindow.classList.toggle('hidden');
        chatWindow.classList.toggle('flex');

        if (!chatWindow.classList.contains('hidden')) {
            chatTooltip.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            chatInput.focus();
        } else {
            chatTooltip.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
        }
    });

    closeChat.addEventListener('click', () => {
        chatWindow.classList.add('hidden');
        chatWindow.classList.remove('flex');
        chatTooltip.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
    });

    chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;

        appendMessage('user', message);
        chatInput.value = '';

        const typingIndicator = showTyping();

        setTimeout(() => {
            typingIndicator.remove();
            appendMessage('bot', 'Esta es una respuesta simulada del sistema. Pronto estaré conectado a Gemini AI para asistirte en tus procesos de venta e inventario.');
        }, 1200);
    });

    function appendMessage(sender, text) {
        const div = document.createElement('div');
        div.className = `flex gap-3 max-w-[85%] ${sender === 'user' ? 'ml-auto flex-row-reverse' : ''}`;

        let imgHtml = '';
        let bubbleClass = '';

        if (sender === 'bot') {
            imgHtml = `<img src="{{ url_for('static', filename='img/pet-pos.png') }}" class="w-8 h-8 rounded-full bg-zinc-200 dark:bg-zinc-800 flex-shrink-0 object-cover border border-zinc-200 dark:border-zinc-700">`;
            bubbleClass = 'bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl rounded-tl-none text-zinc-800 dark:text-zinc-200';
        } else {
            bubbleClass = 'bg-zinc-900 dark:bg-zinc-50 text-zinc-50 dark:text-zinc-900 rounded-2xl rounded-tr-none';
        }

        div.innerHTML = `
            ${imgHtml}
            <div class="${bubbleClass} px-4 py-2.5 text-sm shadow-sm break-words w-full">
                ${text}
            </div>
        `;

        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'flex gap-3 max-w-[85%]';
        div.innerHTML = `
            <img src="{{ url_for('static', filename='img/pet-pos.png') }}" class="w-8 h-8 rounded-full bg-zinc-200 dark:bg-zinc-800 flex-shrink-0 object-cover border border-zinc-200 dark:border-zinc-700">
            <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-1 shadow-sm">
                <div class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce"></div>
                <div class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></div>
                <div class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
            </div>
        `;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
    }
</script>
