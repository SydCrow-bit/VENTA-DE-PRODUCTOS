{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h3>Editar Producto: {{ producto.nombre }}</h3>
        </div>
        <div class="card-body">
            <form action="{{ url_for('editar_producto', id=producto.id) }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select name="category_id" class="form-select" required>
                        {% for cat in categorias %}
                            <option value="{{ cat.id }}" {% if cat.id == producto.category_id %}selected{% endif %}>
                                {{ cat.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Stock</label>
                        <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-warning">Guardar Cambios</button>
                <a href="{{ url_for('lista_productos') }}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
