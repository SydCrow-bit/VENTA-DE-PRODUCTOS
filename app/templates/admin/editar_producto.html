{% extends "base.html" %}

{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-6">
    <div class="w-full max-w-2xl rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-8 shadow-sm">
        <div class="flex flex-col space-y-1.5 mb-8">
            <h3 class="font-semibold tracking-tight text-2xl">Editar Producto</h3>
            <p class="text-sm text-zinc-500 dark:text-zinc-400">Modificando los detalles de: <strong>{{ producto.nombre }}</strong></p>
        </div>

        <form action="{{ url_for('routes.editar_producto', id=producto.id) }}" method="POST" class="space-y-6">
            <div class="space-y-2">
                <label for="nombre" class="text-sm font-medium leading-none">Nombre del Producto</label>
                <input type="text" name="nombre" id="nombre" value="{{ producto.nombre }}" required class="flex h-10 w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300">
            </div>

            <div class="space-y-2">
                <label for="category_id" class="text-sm font-medium leading-none">Categoría</label>
                <select name="category_id" id="category_id" required class="flex h-10 w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300 [&>option]:text-zinc-950">
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if cat.id == producto.category_id %}selected{% endif %}>
                            {{ cat.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label for="precio" class="text-sm font-medium leading-none">Precio (Bs.)</label>
                    <input type="number" step="0.01" name="precio" id="precio" value="{{ producto.precio }}" required class="flex h-10 w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300">
                </div>
                <div class="space-y-2">
                    <label for="stock" class="text-sm font-medium leading-none">Stock</label>
                    <input type="number" name="stock" id="stock" value="{{ producto.stock }}" required class="flex h-10 w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300">
                </div>
            </div>

            <div class="space-y-2">
                <label for="descripcion" class="text-sm font-medium leading-none">Descripción</label>
                <textarea name="descripcion" id="descripcion" rows="3" class="flex min-h-[80px] w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300">{{ producto.descripcion }}</textarea>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-4">
                <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-zinc-900 text-zinc-50 hover:bg-zinc-900/90 dark:bg-zinc-50 dark:text-zinc-900 dark:hover:bg-zinc-50/90 h-10 px-4 py-2 flex-1">
                    Guardar Cambios
                </button>
                <a href="{{ url_for('routes.lista_productos') }}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-800 dark:hover:text-zinc-50 h-10 px-4 py-2 flex-1">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
