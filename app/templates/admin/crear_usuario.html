{% extends "base.html" %}

{% block title %}Crear Usuario - Panel Admin{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <i class="fas fa-user-plus"></i>
            <h1>Crear Nuevo Usuario</h1>
            <p>Ingresa los datos para registrar un nuevo acceso al sistema.</p>
        </div>

        <form method="POST" class="styled-form">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Nombre de Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ej: kcopali" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="role"><i class="fas fa-user-tag"></i> Asignar Rol</label>
                <select id="role" name="role">
                    <option value="usuario">Usuario Estándar</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">
                    <i class="fas fa-check"></i> Guardar Usuario
                </button>
                <a href="{{ url_for('admin.usuarios') }}" class="btn-cancel">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
