{% extends "base.html" %}

{% block title %}Registrar Producto{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-6">
    <div class="w-full max-w-2xl rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-8 shadow-sm">
        <div class="flex flex-col space-y-1.5 mb-8">
            <h3 class="font-semibold tracking-tight text-2xl">Registrar Nuevo Producto</h3>
            <p class="text-sm text-zinc-500 dark:text-zinc-400">Completa los detalles para añadir un artículo al inventario.</p>
        </div>

        <form action="{{ url_for('routes.crear_producto') }}" method="POST" class="space-y-6">
            <div class="space-y-2">
                <label for="nombre" class="text-sm font-medium leading-none">Nombre del Producto</label>
                <input type="text" name="nombre" id="nombre" placeholder="Ej. Laptop Asus Zenbook" required class="flex h-10 w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300">
            </div>

            <div class="space-y-2">
                <label for="category_id" class="text-sm font-medium leading-none">Categoría</label>
                <select name="category_id" id="category_id" required class="flex h-10 w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300 [&>option]:text-zinc-950">
                    <option value="" selected disabled>Selecciona una categoría...</option>
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                    {% endfor %}
                </select>
                <p class="text-xs text-zinc-500 dark:text-zinc-400">Si no aparece la categoría, debes crearla primero.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label for="precio" class="text-sm font-medium leading-none">Precio (Bs.)</label>
                    <input type="number" step="0.01" name="precio" id="precio" placeholder="0.00" required class="flex h-10 w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300">
                </div>
                <div class="space-y-2">
                    <label for="stock" class="text-sm font-medium leading-none">Stock Inicial</label>
                    <input type="number" name="stock" id="stock" value="0" required class="flex h-10 w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300">
                </div>
            </div>

            <div class="space-y-2">
                <label for="descripcion" class="text-sm font-medium leading-none">Descripción (Opcional)</label>
                <textarea name="descripcion" id="descripcion" rows="3" class="flex min-h-[80px] w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300"></textarea>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-4">
                <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-zinc-900 text-zinc-50 hover:bg-zinc-900/90 dark:bg-zinc-50 dark:text-zinc-900 dark:hover:bg-zinc-50/90 h-10 px-4 py-2 flex-1">
                    Guardar Producto
                </button>
                <a href="{{ url_for('routes.lista_productos') }}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-800 dark:hover:text-zinc-50 h-10 px-4 py-2 flex-1">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
