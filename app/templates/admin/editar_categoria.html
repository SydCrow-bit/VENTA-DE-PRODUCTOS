{% extends "base.html" %}

{% block title %}Editar Categoría{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-10">
    <div class="w-full max-w-md rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-8 shadow-sm">
        <div class="flex flex-col space-y-1.5 mb-6">
            <h3 class="font-semibold tracking-tight text-2xl">Editar Categoría</h3>
            <p class="text-sm text-zinc-500 dark:text-zinc-400">Modifica el nombre de la clasificación.</p>
        </div>

        <form action="{{ url_for('routes.editar_categoria', id=categoria.id) }}" method="POST" class="space-y-4">
            <div class="space-y-2">
                <label for="nombre" class="text-sm font-medium leading-none">Nombre de la Categoría</label>
                <input type="text" name="nombre" id="nombre" value="{{ categoria.nombre }}" required class="flex h-10 w-full rounded-md border border-zinc-200 dark:border-zinc-800 bg-transparent px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-zinc-300">
            </div>

            <div class="flex flex-col gap-2 pt-4">
                <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-zinc-900 text-zinc-50 hover:bg-zinc-900/90 dark:bg-zinc-50 dark:text-zinc-900 dark:hover:bg-zinc-50/90 h-10 px-4 py-2">
                    Actualizar
                </button>
                <a href="{{ url_for('routes.lista_categorias') }}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-800 dark:hover:text-zinc-50 h-10 px-4 py-2">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
